<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 3D Viewer</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="container"></div>
    <div id="loading-spinner" class="spinner">
        <div class="spinner-content">
            <p>Cargando modelo 3D...</p>
        </div>
    </div>
    <div id="error-message" class="error-box"></div>
    
    <div id="controls-panel">
        <div class="control-group">
            <label>Luz Ambiental</label>
            <input type="range" id="ambient-intensity" min="0" max="1" step="0.1" value="0.5">
        </div>
        <div class="control-group">
            <label>Luz Directa</label>
            <input type="range" id="directional-intensity" min="0" max="2" step="0.1" value="1">
        </div>
        <div class="control-group">
            <label>Fondo</label>
            <input type="color" id="bg-color" value="#000000">
        </div>
        <button id="reset-view" class="btn-reset">Resetear Vista</button>
    </div>

    <script src="./js/viewer.js"></script>
</body>
</html>
